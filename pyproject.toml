[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-eyes"
version = "0.1.0"
description = "Let coding agents watch videos: index once, then skim, search, zoom, and measure editing style. Runs locally."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pillow",
    "numpy",
    "rapidocr>=3; sys_platform != 'darwin'",
    "onnxruntime; sys_platform != 'darwin'",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3", "onnxruntime"]

[project.scripts]
eyes = "eyes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eyes"]
